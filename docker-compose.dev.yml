version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: detecktiv-db-dev
    environment:
      POSTGRES_DB: detecktiv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: detecktiv_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d detecktiv"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Backend API
  api:
    build:
      context: .
      dockerfile: docker/dev/backend.Dockerfile
    container_name: detecktiv-api-dev
    environment:
      # Database connection
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_DB: detecktiv
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: detecktiv_dev_pass
      POSTGRES_SCHEMA: app
      
      # API configuration
      ENVIRONMENT: development
      DEBUG: true
      LOG_LEVEL: DEBUG
      
      # CORS configuration
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      
      # Auth
      SECRET_KEY: dev-secret-key-change-in-production
      
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
    restart: unless-stopped

  # Frontend (React)
  web:
    build:
      context: .
      dockerfile: docker/dev/web.Dockerfile
    container_name: detecktiv-web-dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    restart: unless-stopped

  # Redis for caching and job queues
  redis:
    image: redis:7-alpine
    container_name: detecktiv-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data_dev:
  redis_data_dev:
# Simple Docker Compose for the streamlined setup
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: detecktiv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: OPqw1290
      POSTGRES_DB: detecktiv
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d detecktiv -h 127.0.0.1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: detecktiv-api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: OPqw1290
      POSTGRES_DB: detecktiv
      FORCE_POSTGRES: 1
      INCLUDE_AGGREGATED_API_ROUTER: 1
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: >
      sh -c '
        echo "[api] waiting for postgres...";
        until nc -z postgres 5432; do
          sleep 1;
        done;
        echo "[api] postgres is up";
        
        echo "[api] setting up database schema...";
        python setup_db.py || echo "Database setup failed, continuing...";
        
        echo "[api] starting server...";
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      '
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      target: prod
    container_name: detecktiv-frontend-simple
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_API_BASE: http://localhost:8000
    ports:
      - "4173:4173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres-data:
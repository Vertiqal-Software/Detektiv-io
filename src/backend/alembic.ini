# alembic.ini — Detecktiv.io
#
# Notes:
# - Do NOT put DB credentials here. env.py builds sqlalchemy.url from env vars.
# - Logging stays compact; bump logger_sqlalchemy to INFO when debugging.
# - revision_environment=true so env.py runs for revision generation/checks.
# - Optional (commented) multi-directory settings for broken/legacy chains.

[alembic]
# Use a path-robust location relative to this file
script_location = %(here)s/alembic
prepend_sys_path = .
version_table = alembic_version
# version_table_schema is set by env.py via DB_SCHEMA/POSTGRES_SCHEMA (default: public)
# version_table_schema =
timezone = UTC
file_template = %%(rev)s_%%(slug)s
output_encoding = utf-8

# IMPORTANT:
# Do NOT put credentials here. env.py will set sqlalchemy.url from:
#   DATABASE_URL  OR  POSTGRES_* (host, port, db, user, password)
sqlalchemy.url =

# Ensure env.py is consulted when generating revisions (safe to enable)
revision_environment = true

# Allow Alembic to read multiple version directories (enables painless repair of broken chains).
# When we’re ready to separate legacy/new heads, we’ll set version_locations below.
# Using OS path separator (":" on *nix, ";" on Windows) keeps it portable.
version_path_separator = os
# Example (uncomment when directories exist):
# version_locations = %(here)s/alembic/versions%(version_path_separator)s%(here)s/alembic/legacy_versions

# (Optional) Limit auto-generated slug length (uncomment to use)
# truncate_slug_length = 64

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

# Set to INFO to see executed SQL during migration debugging
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
# Timestamped, compact log lines
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S

# -----------------------------------------------------------------------------
# (Optional) Post-write hooks — run tools after Alembic creates a new revision
# Uncomment and adjust paths if you want newly generated migrations auto-formatted.
#
# [post_write_hooks]
# hooks = black
#
# [post_write_hooks.black]
# type = console_scripts
# entrypoint = black
# options = -q
# -----------------------------------------------------------------------------

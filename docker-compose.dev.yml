# Sales Intelligence Platform - Docker Compose Configuration

version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: sales-intelligence-db
    environment:
      POSTGRES_DB: sales_intelligence
      POSTGRES_USER: sales_user
      POSTGRES_PASSWORD: sales_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_user -d sales_intelligence"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Sales Intelligence API
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sales-intelligence-api
    environment:
      # Database connection
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_DB: sales_intelligence
      POSTGRES_USER: sales_user
      POSTGRES_PASSWORD: sales_secure_password
      
      # Companies House API (add your key here)
      COMPANIES_HOUSE_API_KEY: ${COMPANIES_HOUSE_API_KEY:-}
      
      # API configuration
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      
      # CORS configuration
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:5173
      
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./src/backend:/app/src/backend
      - ./src/intelligence:/app/src/intelligence
      - ./src/scrapers:/app/src/scrapers
      - ./src/analytics:/app/src/analytics
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend (React)
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: sales-intelligence-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_NAME: "Sales Intelligence Platform"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Redis for caching and job queues (optional)
  redis:
    image: redis:7-alpine
    container_name: sales-intelligence-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
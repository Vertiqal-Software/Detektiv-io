version: "3.9"

# Load environment in this order: .env.docker first, then .env (for overrides)
x-env-files: &env_files
  - ./.env.docker
  - ./.env

x-restart: &restart_policy
  restart: unless-stopped

networks:
  detecktiv:
    name: detecktiv-prod-net

volumes:
  postgres-data:
  pgadmin-data:
  caddy-data:
  caddy-config:
  grafana-data:

services:
  # ============================== DATABASE ===============================
  postgres:
    image: postgres:15-alpine
    container_name: detecktiv-prod-postgres
    <<: *restart_policy
    env_file: *env_files
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1 || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - detecktiv

  # ================================ API =================================
  api:
    build:
      context: .
      dockerfile: ${API_DOCKERFILE:-Dockerfile}
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11-slim}
    container_name: detecktiv-prod-api
    <<: *restart_policy
    env_file: *env_files
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    working_dir: /app
    command: >
      bash -lc '
      set -euo pipefail;
      echo "[api] applying migrations";
      alembic upgrade head || true;
      if [ "${GUNICORN:-1}" = "1" ]; then
        echo "[api] starting gunicorn";
        exec gunicorn app.main:app
          --workers "${GUNICORN_WORKERS:-2}"
          --worker-class "${GUNICORN_WORKER_CLASS:-uvicorn.workers.UvicornWorker}"
          --bind "0.0.0.0:${PORT:-8000}"
          --timeout "${GUNICORN_TIMEOUT:-60}"
          --access-logfile -
          --error-logfile -;
      else
        echo "[api] starting uvicorn";
        exec uvicorn app.main:app
          --host "${HOST:-0.0.0.0}"
          --port "${PORT:-8000}";
      fi
      '
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8000/health >/dev/null 2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - detecktiv

  # =============================== CADDY ================================
  caddy:
    image: caddy:2
    container_name: detecktiv-prod-caddy
    <<: *restart_policy
    env_file: *env_files
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - detecktiv

  # ============================ ADMIN (optional) ========================
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: detecktiv-prod-pgadmin
    <<: *restart_policy
    env_file: *env_files
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - detecktiv

  # =========================== MONITORING (optional) ====================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: detecktiv-prod-prometheus
    <<: *restart_policy
    env_file: *env_files
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - detecktiv

  grafana:
    image: grafana/grafana:11.0.0
    container_name: detecktiv-prod-grafana
    <<: *restart_policy
    env_file: *env_files
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/monitoring/provisioning/:/etc/grafana/provisioning:ro
    networks:
      - detecktiv

  # ============================== FRONTEND ==============================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      target: prod
    container_name: detecktiv-prod-frontend
    <<: *restart_policy
    env_file: *env_files
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_API_BASE: ${VITE_API_BASE:-/api}
    expose:
      - "4173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4173/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - detecktiv
